#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
综测计算助手 - Pytest配置文件
"""
import asyncio
import sys
import os

sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    -p no:warnings
markers =
    auth: 认证相关测试
    student: 学生相关测试
    teacher: 教师相关测试
    admin: 管理员相关测试
    ai: AI助手相关测试
    integration: 集成测试
    comprehensive: 综测相关测试
    certificate: 证书相关测试
    file: 文件管理相关测试
    rag: RAG系统相关测试
    slow: 慢速测试
    unit: 单元测试
    api: API测试
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
