[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    auth: 认证相关测试
    student: 学生相关测试
    teacher: 教师相关测试
    admin: 管理员相关测试
    ai: AI助手相关测试
    slow: 慢速测试
    integration: 集成测试
