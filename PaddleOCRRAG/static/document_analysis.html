<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档分析结果 - PaddleOCR RAG系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
        }
        .analysis-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            padding: 25px;
            transition: all 0.3s ease;
        }
        .analysis-card:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }
        .card-title {
            color: #6a11cb;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .card-title i {
            margin-right: 10px;
        }
        .formula-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .ratio-item {
            background-color: #f8f9fa;
            border-left: 4px solid #6a11cb;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .ratio-item h5 {
            color: #6a11cb;
            margin-bottom: 8px;
        }
        .ratio-percentage {
            font-size: 2rem;
            font-weight: bold;
            color: #2575fc;
        }
        .rule-item {
            background-color: #f8f9fa;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .rule-item:hover {
            background-color: #e9ecef;
            border-left-color: #6a11cb;
        }
        .rule-index {
            display: inline-block;
            background-color: #6a11cb;
            color: white;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            margin-right: 10px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .rule-similarity {
            float: right;
            background-color: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
        }
        .analysis-text {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 5px;
            font-size: 1.05rem;
            line-height: 1.8;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #6a11cb;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(106, 17, 203, 0.4);
            color: white;
        }
        .stats-badge {
            display: inline-block;
            background-color: #e9ecef;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9rem;
        }
        .stats-badge i {
            margin-right: 5px;
            color: #6a11cb;
        }
        .progress-bar-custom {
            background-color: #e9ecef;
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .progress-a { background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
        .progress-b { background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); }
        .progress-c { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); }
        .metadata-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .metadata-item {
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 10px;
        }
        .metadata-item strong {
            color: #6a11cb;
        }
        .chart-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 200px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            margin-top: 20px;
        }
        .chart-bar {
            width: 80px;
            background: linear-gradient(180deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 10px 10px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            color: white;
            font-weight: bold;
            transition: all 0.5s ease;
            position: relative;
        }
        .chart-bar:hover {
            opacity: 0.8;
        }
        .chart-label {
            position: absolute;
            bottom: -30px;
            font-size: 0.9rem;
            color: #333;
            font-weight: normal;
        }
        .chart-value {
            padding: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="header text-center">
        <h1><i class="bi bi-file-earmark-text"></i> 文档分析结果</h1>
        <p class="lead">综合测评实施细则智能分析系统</p>
    </div>

    <div class="container">
        <div class="row mb-4">
            <div class="col-12 text-end">
                <button class="btn refresh-btn" id="refreshBtn">
                    <i class="bi bi-arrow-clockwise"></i> 刷新数据
                </button>
            </div>
        </div>

        <div class="loading" id="loadingIndicator">
            <div class="loading-spinner"></div>
            <p class="mt-3">正在分析文档，请稍候...</p>
        </div>

        <div id="errorContainer" style="display: none;">
            <div class="error-message">
                <i class="bi bi-exclamation-triangle"></i> <span id="errorMessage"></span>
            </div>
        </div>

        <div id="contentContainer" style="display: none;">
            <div class="row">
                <div class="col-12">
                    <div class="analysis-card">
                        <h4 class="card-title"><i class="bi bi-info-circle"></i>文档概览</h4>
                        <div id="metadataSection" class="metadata-section">
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="analysis-card">
                        <h4 class="card-title"><i class="bi bi-calculator"></i>综测计算公式</h4>
                        <div class="formula-display" id="formulaDisplay">
                            M = 20% × A + 70% × B + 10% × C
                        </div>
                        <div id="ratiosContainer">
                        </div>
                        <div class="chart-container" id="chartContainer">
                            <div class="chart-bar" id="barA" style="height: 0px;">
                                <div class="chart-value">20%</div>
                                <div class="chart-label">品德行为分</div>
                            </div>
                            <div class="chart-bar" id="barB" style="height: 0px;">
                                <div class="chart-value">70%</div>
                                <div class="chart-label">学习成绩分</div>
                            </div>
                            <div class="chart-bar" id="barC" style="height: 0px;">
                                <div class="chart-value">10%</div>
                                <div class="chart-label">素质拓展分</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="analysis-card">
                        <h4 class="card-title"><i class="bi bi-lightbulb"></i>分析说明</h4>
                        <div class="analysis-text" id="analysisText">
                            正在加载分析说明...
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="analysis-card">
                        <h4 class="card-title">
                            <i class="bi bi-list-check"></i>计算规则详情
                            <span class="stats-badge" id="rulesCount">
                                <i class="bi bi-collection"></i>共 0 条规则
                            </span>
                        </h4>
                        <div id="rulesContainer">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = '/api/v1';
        
        document.addEventListener('DOMContentLoaded', function() {
            loadDocumentAnalysis();
        });
        
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadDocumentAnalysis();
        });
        
        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
            document.getElementById('contentContainer').style.display = show ? 'none' : 'block';
            document.getElementById('errorContainer').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('contentContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
        
        async function loadDocumentAnalysis() {
            showLoading(true);
            
            try {
                const response = await fetch(`${API_BASE_URL}/documents/analyze/overview`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.message || '文档分析失败');
                }
                
                renderAnalysis(data.data);
                showLoading(false);
            } catch (error) {
                console.error('加载文档分析失败:', error);
                showError('加载失败: ' + error.message);
            }
        }
        
        function renderAnalysis(data) {
            renderMetadata(data.metadata);
            renderRatios(data.ratios);
            renderAnalysisText(data.analysis);
            renderRules(data.rules);
        }
        
        function renderMetadata(metadata) {
            const container = document.getElementById('metadataSection');
            let html = '';
            
            if (metadata.file_name) {
                html += `<div class="metadata-item"><strong><i class="bi bi-file-earmark"></i> 文档名称:</strong> ${metadata.file_name}</div>`;
            }
            if (metadata.rules_count !== undefined) {
                html += `<div class="metadata-item"><strong><i class="bi bi-collection"></i> 规则数量:</strong> ${metadata.rules_count} 条</div>`;
            }
            if (metadata.has_formula !== undefined) {
                html += `<div class="metadata-item"><strong><i class="bi bi-calculator"></i> 公式识别:</strong> ${metadata.has_formula ? '已识别' : '未识别'}</div>`;
            }
            if (metadata.analysis_length) {
                html += `<div class="metadata-item"><strong><i class="bi bi-text-left"></i> 分析长度:</strong> ${metadata.analysis_length} 字</div>`;
            }
            
            container.innerHTML = html || '<p class="text-muted">暂无元数据</p>';
        }
        
        function renderRatios(ratios) {
            const formulaDisplay = document.getElementById('formulaDisplay');
            const ratiosContainer = document.getElementById('ratiosContainer');
            
            if (ratios.formula) {
                formulaDisplay.textContent = ratios.formula;
            }
            
            const ratioData = ratios.data || {};
            const components = ratios.components || {};
            
            const defaultComponents = {
                'A': { name: '品德行为分', description: '品德行为表现评分' },
                'B': { name: '学习成绩分', description: '学业成绩评分' },
                'C': { name: '素质拓展分', description: '综合素质拓展评分' }
            };
            
            const mergedComponents = { ...defaultComponents, ...components };
            
            let html = '<div class="row">';
            
            ['A', 'B', 'C'].forEach(key => {
                const ratio = ratioData[key] || 0;
                const percentage = Math.round(ratio * 100);
                const component = mergedComponents[key] || defaultComponents[key];
                
                html += `
                    <div class="col-md-4">
                        <div class="ratio-item">
                            <h5>${key} - ${component.name}</h5>
                            <div class="ratio-percentage">${percentage}%</div>
                            <p class="text-muted mb-0">${component.description || component.name}</p>
                            <div class="progress-bar-custom">
                                <div class="progress-fill progress-${key.toLowerCase()}" style="width: ${percentage}%">
                                    ${percentage}%
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            ratiosContainer.innerHTML = html;
            
            setTimeout(() => {
                const maxHeight = 160;
                ['A', 'B', 'C'].forEach(key => {
                    const ratio = ratioData[key] || 0;
                    const percentage = Math.round(ratio * 100);
                    const height = (percentage / 100) * maxHeight;
                    const bar = document.getElementById(`bar${key}`);
                    if (bar) {
                        bar.style.height = height + 'px';
                    }
                });
            }, 100);
        }
        
        function renderAnalysisText(analysis) {
            const container = document.getElementById('analysisText');
            container.textContent = analysis || '暂无分析说明';
        }
        
        function renderRules(rules) {
            const container = document.getElementById('rulesContainer');
            const countBadge = document.getElementById('rulesCount');
            
            countBadge.innerHTML = `<i class="bi bi-collection"></i>共 ${rules.length} 条规则`;
            
            if (!rules || rules.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">暂无规则数据</p>';
                return;
            }
            
            let html = '';
            rules.forEach((rule, index) => {
                const similarity = rule.similarity ? (rule.similarity * 100).toFixed(1) : '0.0';
                const content = rule.content || '无内容';
                const displayContent = content.length > 200 ? content.substring(0, 200) + '...' : content;
                
                html += `
                    <div class="rule-item">
                        <span class="rule-index">${index + 1}</span>
                        <span class="rule-similarity">相似度: ${similarity}%</span>
                        <p class="mb-0">${displayContent}</p>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
