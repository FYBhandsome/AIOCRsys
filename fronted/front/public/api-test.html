<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API接口测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eee;
        }
        .config-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .results {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-entry {
            margin-bottom: 4px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .log-success {
            color: #4caf50;
        }
        .log-error {
            color: #f44336;
        }
        .log-info {
            color: #2196f3;
        }
        .log-warning {
            color: #ff9800;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .stat-card.error {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
        }
        .stat-label {
            opacity: 0.9;
            margin-top: 4px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            transition: width 0.3s;
        }
        .test-section {
            margin-bottom: 20px;
        }
        .test-section h3 {
            color: #667eea;
            margin-bottom: 12px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 API接口测试</h1>
            <p>综测计算助手 - 前端API集成测试工具</p>
        </div>

        <div class="card">
            <h2>⚙️ 测试配置</h2>
            <div class="config-section">
                <div class="form-group">
                    <label>API服务地址</label>
                    <input type="text" id="baseUrl" value="http://localhost:8001">
                </div>
                <div class="form-group">
                    <label>RAG服务地址</label>
                    <input type="text" id="ragUrl" value="http://localhost:8000">
                </div>
                <div class="form-group">
                    <label>测试用户</label>
                    <select id="testUser">
                        <option value="admin">管理员 (dev_admin)</option>
                        <option value="teacher">教师 (dev_teacher)</option>
                        <option value="student">学生 (dev_student)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>测试密码</label>
                    <input type="password" id="testPassword" value="dev123456">
                </div>
            </div>
            <button class="btn btn-primary" onclick="runAllTests()">
                <span id="runText">▶️ 运行所有测试</span>
                <span id="runLoading" class="loading hidden"></span>
            </button>
            <button class="btn btn-info" onclick="clearResults()">🗑️ 清空结果</button>
        </div>

        <div class="card">
            <h2>📊 测试统计</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总测试数</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-value" id="passedCount">0</div>
                    <div class="stat-label">通过</div>
                </div>
                <div class="stat-card error">
                    <div class="stat-value" id="failedCount">0</div>
                    <div class="stat-label">失败</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="passRate">0%</div>
                    <div class="stat-label">通过率</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="card">
            <h2>📋 测试结果</h2>
            <div class="results" id="results">
                <div class="log-info">等待开始测试...</div>
            </div>
        </div>
    </div>

    <script>
        // 测试配置
        const config = {
            baseUrl: 'http://localhost:8001',
            ragUrl: 'http://localhost:8000',
            timeout: 30000
        };

        // 测试用户
        const testUsers = {
            admin: { username: 'dev_admin', password: 'dev123456' },
            teacher: { username: 'dev_teacher', password: 'dev123456' },
            student: { username: 'dev_student', password: 'dev123456' }
        };

        // 测试结果
        let results = {
            total: 0,
            passed: 0,
            failed: 0,
            errors: []
        };

        // 当前token
        let authToken = null;

        // 日志输出
        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            resultsDiv.appendChild(entry);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalCount').textContent = results.total;
            document.getElementById('passedCount').textContent = results.passed;
            document.getElementById('failedCount').textContent = results.failed;
            
            const rate = results.total > 0 ? ((results.passed / results.total) * 100).toFixed(1) : 0;
            document.getElementById('passRate').textContent = `${rate}%`;
            document.getElementById('progressBar').style.width = `${rate}%`;
        }

        // 测试断言
        function assert(condition, testName, error = null) {
            results.total++;
            if (condition) {
                results.passed++;
                log(`✅ ${testName}`, 'success');
            } else {
                results.failed++;
                results.errors.push({ name: testName, error: error || '断言失败' });
                log(`❌ ${testName}: ${error || '断言失败'}`, 'error');
            }
            updateStats();
        }

        // HTTP请求封装
        async function request(method, url, data = null, headers = {}) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    ...headers
                }
            };

            if (authToken) {
                options.headers['Authorization'] = `Bearer ${authToken}`;
            }

            if (data && method !== 'GET') {
                options.body = JSON.stringify(data);
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), config.timeout);
            options.signal = controller.signal;

            try {
                const response = await fetch(url, options);
                clearTimeout(timeoutId);
                const result = await response.json();
                return { success: response.ok, status: response.status, data: result };
            } catch (error) {
                clearTimeout(timeoutId);
                return { success: false, error: error.message };
            }
        }

        // 认证API测试
        async function testAuthAPI() {
            log('\n=== 认证API测试 ===', 'info');
            
            const userType = document.getElementById('testUser').value;
            const password = document.getElementById('testPassword').value;
            const user = { ...testUsers[userType], password };

            // 登录测试
            const loginResult = await request('POST', `${config.baseUrl}/v1/auth/login`, {
                username: user.username,
                password: user.password
            });
            assert(loginResult.success && loginResult.data?.token, '用户登录', loginResult.error);

            if (loginResult.success && loginResult.data?.token) {
                authToken = loginResult.data.token;
                log(`获取Token: ${authToken.substring(0, 20)}...`, 'info');
            }

            // 获取用户信息
            const userInfoResult = await request('GET', `${config.baseUrl}/v1/auth/me`);
            assert(userInfoResult.success && userInfoResult.data?.username, '获取用户信息', userInfoResult.error);
        }

        // 学生API测试
        async function testStudentAPI() {
            log('\n=== 学生API测试 ===', 'info');

            // 获取成绩摘要
            const scoresResult = await request('GET', `${config.baseUrl}/v1/student/scores/summary`);
            assert(scoresResult.success, '获取成绩摘要', scoresResult.error);

            // 获取上传历史
            const historyResult = await request('GET', `${config.baseUrl}/v1/student/upload-history`);
            assert(historyResult.success, '获取上传历史', historyResult.error);

            // 获取材料列表
            const materialsResult = await request('GET', `${config.baseUrl}/v1/student/materials`);
            assert(materialsResult.success, '获取材料列表', materialsResult.error);
        }

        // 教师API测试
        async function testTeacherAPI() {
            log('\n=== 教师API测试 ===', 'info');

            // 获取学生列表
            const studentsResult = await request('GET', `${config.baseUrl}/v1/teacher/students`);
            assert(studentsResult.success, '获取学生列表', studentsResult.error);

            // 获取班级列表
            const classesResult = await request('GET', `${config.baseUrl}/v1/teacher/classes`);
            assert(classesResult.success, '获取班级列表', classesResult.error);
        }

        // 管理员API测试
        async function testAdminAPI() {
            log('\n=== 管理员API测试 ===', 'info');

            // 获取用户列表
            const usersResult = await request('GET', `${config.baseUrl}/v1/admin/users`);
            assert(usersResult.success, '获取用户列表', usersResult.error);

            // 获取系统设置
            const settingsResult = await request('GET', `${config.baseUrl}/v1/admin/settings`);
            assert(settingsResult.success, '获取系统设置', settingsResult.error);

            // 获取规则文档
            const rulesResult = await request('GET', `${config.baseUrl}/v1/admin/rules`);
            assert(rulesResult.success, '获取规则文档', rulesResult.error);
        }

        // RAG API测试
        async function testRagAPI() {
            log('\n=== RAG API测试 ===', 'info');

            // AI对话测试
            const chatResult = await request('POST', `${config.ragUrl}/api/chat`, {
                message: '什么是综测？',
                history: [],
                use_rag: true
            });
            assert(chatResult.success && chatResult.data?.answer, 'AI对话测试', chatResult.error);

            // 获取系统信息
            const sysInfoResult = await request('GET', `${config.ragUrl}/api/system/info`);
            assert(sysInfoResult.success, '获取RAG系统信息', sysInfoResult.error);
        }

        // 综测计算API测试
        async function testComprehensiveAPI() {
            log('\n=== 综测计算API测试 ===', 'info');

            // 获取综测配置
            const configResult = await request('GET', `${config.baseUrl}/v1/comprehensive/configs`);
            assert(configResult.success, '获取综测配置', configResult.error);

            // 获取班级列表
            const classListResult = await request('GET', `${config.baseUrl}/v1/comprehensive/classes`);
            assert(classListResult.success, '获取班级列表', classListResult.error);
        }

        // 文件API测试
        async function testFileAPI() {
            log('\n=== 文件API测试 ===', 'info');

            // 获取文件列表
            const filesResult = await request('GET', `${config.baseUrl}/v1/files/list`);
            assert(filesResult.success, '获取文件列表', filesResult.error);
        }

        // 清空结果
        function clearResults() {
            results = { total: 0, passed: 0, failed: 0, errors: [] };
            updateStats();
            document.getElementById('results').innerHTML = '<div class="log-info">等待开始测试...</div>';
        }

        // 运行所有测试
        async function runAllTests() {
            // 更新配置
            config.baseUrl = document.getElementById('baseUrl').value;
            config.ragUrl = document.getElementById('ragUrl').value;

            // 重置结果
            results = { total: 0, passed: 0, failed: 0, errors: [] };
            authToken = null;
            updateStats();
            document.getElementById('results').innerHTML = '';

            // 显示加载状态
            document.getElementById('runText').classList.add('hidden');
            document.getElementById('runLoading').classList.remove('hidden');

            log('========================================', 'info');
            log('开始执行API接口测试', 'info');
            log('========================================', 'info');

            const startTime = Date.now();

            try {
                await testAuthAPI();
                await testStudentAPI();
                await testTeacherAPI();
                await testAdminAPI();
                await testRagAPI();
                await testComprehensiveAPI();
                await testFileAPI();
            } catch (error) {
                log(`测试执行错误: ${error.message}`, 'error');
            }

            const duration = Date.now() - startTime;

            log('\n========================================', 'info');
            log('测试结果汇总', 'info');
            log('========================================', 'info');
            log(`✅ 通过: ${results.passed}`, 'success');
            log(`❌ 失败: ${results.failed}`, 'error');
            log(`⏱️ 耗时: ${duration}ms`, 'info');
            log(`📊 通过率: ${((results.passed / results.total) * 100).toFixed(1)}%`, 'info');

            if (results.errors.length > 0) {
                log('\n错误详情:', 'warning');
                results.errors.forEach((err, i) => {
                    log(`${i + 1}. ${err.name}: ${err.error}`, 'error');
                });
            }

            // 恢复按钮状态
            document.getElementById('runText').classList.remove('hidden');
            document.getElementById('runLoading').classList.add('hidden');
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', () => {
            log('测试页面加载完成，点击"运行所有测试"开始测试', 'info');
        });
    </script>
</body>
</html>
